# Local dependencies for development. Object storage and Vault are added when their features land.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: usp
      POSTGRES_USER: usp
      POSTGRES_PASSWORD: usp
    ports: ["5433:5432"]   # 5433: avoids clashing with a local PostgreSQL on 5432
    volumes: [pgdata:/var/lib/postgresql/data]
  gotenberg:
    # HTML → PDF for issued documents (Chromium: correct Arabic shaping / RTL).
    image: gotenberg/gotenberg:8
    ports: ["3000:3000"]
volumes:
  pgdata:
